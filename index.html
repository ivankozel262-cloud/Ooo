<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Поймай звезду</title>
<style>
  :root { --bg: #0b1020; --fg: #f4f6ff; --accent: #ffd34d; --muted: #8a93b8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, system-ui, sans-serif; overflow: hidden; touch-action: manipulation; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    padding: 16px; font-size: 20px; font-weight: 600; z-index: 2; }
  #field { position: fixed; inset: 0; }
  .star { position: absolute; font-size: 48px; line-height: 1; user-select: none; cursor: pointer;
    transition: transform .1s; }
  .star:active { transform: scale(.8); }
  .pop { position: absolute; color: var(--accent); font-weight: 700; pointer-events: none;
    animation: up .6s ease-out forwards; }
  @keyframes up { to { transform: translateY(-40px); opacity: 0; } }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; text-align: center; padding: 16px; z-index: 3;
    background: rgba(11,16,32,.92); }
  #menu h1 { margin: 0; font-size: 36px; }
  #menu p { margin: 0; color: var(--muted); }
  button { font: inherit; font-size: 22px; font-weight: 700; padding: 14px 32px; border: 0;
    border-radius: 14px; background: var(--accent); color: #1b1b1b; }
</style>
</head>
<body>
<div id="hud"><span>⭐ <b id="score">0</b></span><span>⏱ <b id="time">30</b></span></div>
<div id="field"></div>
<div id="menu">
  <h1>Поймай звезду</h1>
  <p id="msg">Тапай по звёздам, пока они не исчезли.<br>Бомбы 💣 не трогай!</p>
  <p id="best"></p>
  <button id="start">Играть</button>
</div>
<script>
  const field = document.getElementById('field');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const menu = document.getElementById('menu');
  const msg = document.getElementById('msg');
  const bestEl = document.getElementById('best');
  let score, timeLeft, spawnTimer, clockTimer, speed;

  function getBest() { try { return +localStorage.getItem('best') || 0; } catch { return 0; } }
  function setBest(v) { try { localStorage.setItem('best', v); } catch {} }
  bestEl.textContent = getBest() ? 'Рекорд: ' + getBest() : '';

  function spawn() {
    const bomb = Math.random() < 0.2;
    const el = document.createElement('div');
    el.className = 'star';
    el.textContent = bomb ? '💣' : (Math.random() < 0.1 ? '🌟' : '⭐');
    const bonus = el.textContent === '🌟';
    el.style.left = Math.random() * (innerWidth - 60) + 'px';
    el.style.top = 60 + Math.random() * (innerHeight - 130) + 'px';
    el.addEventListener('pointerdown', e => {
      const pts = bomb ? -5 : bonus ? 5 : 1;
      score = Math.max(0, score + pts);
      scoreEl.textContent = score;
      const pop = document.createElement('div');
      pop.className = 'pop';
      pop.textContent = (pts > 0 ? '+' : '') + pts;
      pop.style.left = e.clientX + 'px'; pop.style.top = e.clientY + 'px';
      field.appendChild(pop);
      setTimeout(() => pop.remove(), 600);
      el.remove();
    });
    field.appendChild(el);
    setTimeout(() => el.remove(), speed);
  }

  function start() {
    score = 0; timeLeft = 30; speed = 1400;
    scoreEl.textContent = 0; timeEl.textContent = 30;
    field.innerHTML = '';
    menu.style.display = 'none';
    spawnTimer = setInterval(spawn, 550);
    clockTimer = setInterval(() => {
      timeLeft--; timeEl.textContent = timeLeft;
      speed = Math.max(600, speed - 25); // каждую секунду звёзды живут чуть меньше
      if (timeLeft <= 0) stop();
    }, 1000);
  }

  function stop() {
    clearInterval(spawnTimer); clearInterval(clockTimer);
    field.innerHTML = '';
    const best = getBest();
    if (score > best) { setBest(score); msg.textContent = 'Новый рекорд: ' + score + '! 🎉'; }
    else msg.textContent = 'Твой счёт: ' + score;
    bestEl.textContent = 'Рекорд: ' + Math.max(score, best);
    document.getElementById('start').textContent = 'Ещё раз';
    menu.style.display = 'flex';
  }

  document.getElementById('start').addEventListener('click', start);
</script>
</body>
</html>
