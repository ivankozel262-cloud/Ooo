[project]
name = "sistema"
version = "0.1.0"
description = "Система — живой механизм наблюдения: ядро, миссии и органы"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
sistema = "core.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "plugins"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
